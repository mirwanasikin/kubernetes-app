apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: registry-mahasiswa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/mirwanasikin/flask-registry-app-frontend:latest
          ports:
            - containerPort: 80
